name: Ultimate Anti-DNS-Leak
desc: 彻底切断 iOS 运营商/校园网 DNS 与 WebRTC 泄漏

# 1. 强制开启全局 DNS 接管与 Fake-IP
dns:
  enable: true
  ipv6: false                         # 彻底关闭代理内核 IPv6 解析
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  listen: 0.0.0.0:53
  
  # 引导解析（纯 IP，防止域名解析死循环）
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 主 DNS：全量加密 DoH
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # 强制清空 fallback，禁止并发国内直连解析
  fallback: []
  
  # 强制部分域名直连时走特定加密 DNS
  nameserver-policy:
    "geosite:cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query

# 2. 关键防护规则（在最顶部拦截所有绕过 Stash 内核的 UDP 53 数据包）
rules:
  # 阻止任何尝试绕过 Fake-IP 发往外部 53 端口的明文 UDP DNS 包
  - PORT,53,REJECT
  - PROTOCOL,UDP,PORT,53,REJECT
  
  # 阻止 WebRTC STUN 探测
  - PORT,3478,REJECT
  - DOMAIN-KEYWORD,stun,REJECT
  - DOMAIN-KEYWORD,turn,REJECT

  # 强制所有 Apple 设备的系统级 DNS 解析流量走代理或 Fake-IP
  - DOMAIN,mask.icloud.com,REJECT
  - DOMAIN,mask-h2.icloud.com,REJECT
