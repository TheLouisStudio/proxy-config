name: Ultimate Strict Anti-DNS-Leak
desc: 强制全量代理接管 DNS 与拦截旁路

# 1. 强制覆盖 Stash 系统全局 DNS 行为
dns:
  enable: true
  ipv6: false                           # 禁用 IPv6 解析，防止 IPv6 旁路泄漏
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  listen: 0.0.0.0:53
  respect-rules: true                   # 强制 DNS 查询遵循分流规则

  # 引导 DNS (仅用于解析节点的域名，严格只保留 IP)
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 主 DNS：全量加密 DoH (避免任何明文 UDP 53)
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # 强行指定代理节点的 DNS 解析器 (防止节点域名解析走本地 ISP)
  proxy-server-nameserver:
    - 223.5.5.5

  # 清空 fallback，禁止任何向国外/本地 DNS 的回退并发查询
  fallback: []

# 2. 封堵所有旁路泄露的规则
rules:
  # 拦截明文与加密 DNS 直连
  - PORT,53,REJECT
  - PROTOCOL,UDP,PORT,53,REJECT
  - PORT,853,REJECT

  # 拦截 Apple 强制旁路与私密代理
  - DOMAIN,mask.icloud.com,REJECT
  - DOMAIN,mask-h2.icloud.com,REJECT
  - DOMAIN,mask-api.fe.apple-dns.net,REJECT
  - DOMAIN-SUFFIX,apple-dns.net,REJECT

  # 拦截公共 DNS 直连
  - IP-CIDR,1.1.1.1/32,REJECT,no-resolve
  - IP-CIDR,8.8.8.8/32,REJECT,no-resolve
  - IP-CIDR,114.114.114.114/32,REJECT,no-resolve
  - IP-CIDR,223.5.5.5/32,REJECT,no-resolve

  # 拦截 STUN / WebRTC
  - PORT,3478,REJECT
  - DOMAIN-KEYWORD,stun,REJECT
  - DOMAIN-KEYWORD,turn,REJECT
