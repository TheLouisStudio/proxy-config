name: Stash Anti-Leak (Converted from Verge Script)
desc: 完美移植 Clash Verge 脚本的防泄漏与分流逻辑 (Stash Override 兼容版)

# 1. 对应 Verge 脚本中的全局 DNS 配置
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  listen: 0.0.0.0:1053
  respect-rules: true
  use-system-hosts: false
  cache-algorithm: arc

  default-nameserver:
    - 223.5.5.5
    - 1.2.4.8

  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.4.4/dns-query
    - https://208.67.222.222/dns-query

  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "+.in-addr.arpa"
    - "+.ip6.arpa"
    - "time.*.com"
    - "time.*.gov"
    - "pool.ntp.org"
    - "localhost.work.weixin.qq.com"

# 2. 彻底解决报错的重点：Stash 重写脚本中 nameserver-policy 须写在根路径或独立的单行字符串映射中
nameserver-policy:
  "geosite:private,cn": "https://223.5.5.5/dns-query, https://doh.pub/dns-query"

# 3. 防泄漏硬拦截规则 (插入到预设规则前)
rules:
  - PORT,53,REJECT
  - PROTOCOL,UDP,PORT,53,REJECT
  - PORT,853,REJECT
  - DOMAIN,mask.icloud.com,REJECT
  - DOMAIN,mask-h2.icloud.com,REJECT
  - DOMAIN,mask-api.fe.apple-dns.net,REJECT
